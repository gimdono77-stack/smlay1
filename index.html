<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f0e5">
<title>ဆက်သွယ်ရန်</title>
<style>
:root{color-scheme:light;--page:#f7f0e5;--ink:#5a2433;--burgundy:#7b2439;--deep:#4d1728;--gold:#d8b875}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;background:var(--page);color:var(--ink)}
.page{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100svh;width:100%;overflow:hidden;padding:32px 22px;background:radial-gradient(ellipse at 50% 48%,#fffaf1 0%,transparent 44%),linear-gradient(135deg,var(--page),#eee0d0)}
.shape{position:absolute;z-index:-1;pointer-events:none}
.shape-a{width:min(54vw,620px);aspect-ratio:1;border-radius:50%;top:-34%;left:-14%;border:1px solid color-mix(in srgb,var(--gold) 75%,transparent);box-shadow:inset 0 0 0 22px color-mix(in srgb,var(--burgundy) 3%,transparent),0 0 0 34px color-mix(in srgb,var(--burgundy) 4%,transparent)}
.shape-b{width:min(60vw,700px);aspect-ratio:1;border-radius:50%;right:-23%;bottom:-48%;background:linear-gradient(140deg,color-mix(in srgb,var(--burgundy) 95%,transparent),color-mix(in srgb,var(--deep) 82%,transparent));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gold) 85%,transparent)}
.shape-c{width:clamp(230px,34vw,430px);aspect-ratio:1;border-radius:50%;border:1px solid color-mix(in srgb,var(--burgundy) 18%,transparent);top:50%;left:50%;transform:translate(-50%,-50%)}
.shape-c:before,.shape-c:after{content:"";position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 65%,transparent)}
.shape-c:before{inset:14px}.shape-c:after{inset:-18px;border-color:color-mix(in srgb,var(--burgundy) 12%,transparent)}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 7px color-mix(in srgb,var(--gold) 13%,transparent)}
.dot-one{top:29%;left:29%}.dot-two{right:28%;bottom:29%;width:6px;height:6px;background:var(--burgundy)}
.content{width:min(100%,560px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 16px}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:16px;margin:0 0 42px;color:var(--burgundy);font-size:clamp(14px,2.1vw,18px);letter-spacing:.01em;line-height:1.9;text-wrap:balance}
.eyebrow:before,.eyebrow:after{content:"";display:block;width:clamp(24px,6vw,58px);height:1px;background:linear-gradient(90deg,transparent,var(--burgundy));opacity:.7}
.eyebrow:after{transform:scaleX(-1)}
.button-wrap{position:relative;width:min(100%,390px)}
.contact-button{display:flex;align-items:center;justify-content:center;gap:19px;width:100%;min-height:86px;padding:22px 28px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gold) 75%,white);background:linear-gradient(120deg,var(--burgundy),var(--deep));color:#fffdf3;font:inherit;font-size:clamp(22px,3.4vw,30px);font-weight:700;text-decoration:none;box-shadow:0 17px 36px color-mix(in srgb,var(--burgundy) 20%,transparent),inset 0 1px 0 color-mix(in srgb,white 24%,transparent);transition:transform .2s ease,box-shadow .2s ease;-webkit-tap-highlight-color:transparent}
.contact-button:hover{transform:translateY(-3px);box-shadow:0 22px 42px color-mix(in srgb,var(--burgundy) 25%,transparent),inset 0 1px 0 color-mix(in srgb,white 24%,transparent)}
.contact-button:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
.send-icon{width:29px;height:29px;flex:0 0 auto}
.arrow{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border:1px solid color-mix(in srgb,white 36%,transparent);border-radius:50%;font-family:Arial,sans-serif;font-size:24px;font-weight:400;line-height:1}
@media(max-width:520px){.eyebrow{margin-bottom:42px;gap:10px}.contact-button{min-height:74px;padding:18px 20px;gap:13px}.arrow{width:34px;height:34px;font-size:20px}.shape-a{width:85vw;top:-15%;left:-38%}.shape-b{width:100vw;right:-48%;bottom:-25%}}
@media(prefers-reduced-motion:reduce){.contact-button{transition:none}}
</style>
</head>
<body>
<main class="page">
<div class="shape shape-a" aria-hidden="true"></div><div class="shape shape-b" aria-hidden="true"></div><div class="shape shape-c" aria-hidden="true"></div>
<span class="dot dot-one" aria-hidden="true"></span><span class="dot dot-two" aria-hidden="true"></span>
<section class="content" aria-label="ဆက်သွယ်ရန်">
<p class="eyebrow">ယုံကြည်စွာ ဆော့ကစားနိုင်ပါသည်</p>
<div class="button-wrap">
<a class="contact-button" href="https://smlay.com/" target="_blank" rel="noopener noreferrer" aria-label="ဆက်သွယ်ရန်">
<svg class="send-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.2 3.2 14.6 20c-.4 1-1.8 1-2.2 0l-3-6.2-6.2-3c-1-.4-1-1.8 0-2.2l16.8-6.6c.7-.3 1.5.5 1.2 1.2Z" fill="currentColor"/><path d="m9.4 13.8 5.1-5.1" stroke="#4d1728" stroke-width="1.2" stroke-linecap="round"/></svg>
<span>ဆက်သွယ်ရန်</span><span class="arrow" aria-hidden="true">→</span>
</a>
</div>
</section>
</main>
</body>
</html>
