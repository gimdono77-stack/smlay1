<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5a1827">
  <title>ရွှေမန်းလေး | ဆက်သွယ်ရန်</title>
  <style>
    :root {
      --wine: #641d30;
      --wine-deep: #42121f;
      --gold: #e6bd62;
      --gold-light: #f5df9f;
      --cream: #fffaf0;
      --ink: #38272a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--ink);
      font-family: "Noto Sans Myanmar", "Myanmar Text", "Pyidaungsu", sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(230,189,98,.22) 0 90px, transparent 91px),
        radial-gradient(circle at 86% 75%, rgba(100,29,48,.09) 0 150px, transparent 151px),
        linear-gradient(135deg, #fffaf0 0%, #f6edda 55%, #fff8e9 100%);
      position: relative;
    }
    .orb {
      position: fixed; border-radius: 50%; pointer-events: none;
      border: 1px solid rgba(100,29,48,.10);
      box-shadow: inset 0 0 45px rgba(100,29,48,.035), 0 14px 50px rgba(65,30,20,.035);
    }
    .orb.one { width: 280px; height: 280px; top: -100px; right: 8%; }
    .orb.two { width: 150px; height: 150px; top: 16%; left: 7%; background: rgba(230,189,98,.06); }
    .orb.three { width: 360px; height: 360px; bottom: -190px; left: 20%; }
    .orb.four { width: 90px; height: 90px; bottom: 16%; right: 12%; background: rgba(100,29,48,.04); }
    main {
      width: min(100%, 680px);
      text-align: center;
      padding: clamp(36px, 7vw, 70px) clamp(22px, 6vw, 64px);
      border: 1px solid rgba(142,103,43,.22);
      border-radius: 28px;
      background: rgba(255,252,245,.78);
      box-shadow: 0 28px 90px rgba(69,32,30,.10);
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 1;
    }
    .eyebrow {
      margin: 0 0 18px;
      color: #876c3a;
      font-size: clamp(13px, 2.2vw, 16px);
      letter-spacing: .02em;
    }
    .contact {
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      width: min(100%, 360px);
      min-height: 68px;
      padding: 16px 28px;
      border-radius: 15px;
      color: #351019;
      text-decoration: none;
      font-size: clamp(18px, 3vw, 22px);
      font-weight: 700;
      background: linear-gradient(135deg, #f5d986, #dcae48);
      border: 1px solid #c79b3e;
      box-shadow: 0 10px 0 rgba(111,71,20,.12), 0 18px 30px rgba(130,83,22,.15);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .contact:hover { transform: translateY(-3px); filter: brightness(1.03); box-shadow: 0 13px 0 rgba(111,71,20,.10), 0 22px 34px rgba(130,83,22,.19); }
    .contact:focus-visible { outline: 3px solid var(--wine); outline-offset: 5px; }
    .arrow { font-family: Arial, sans-serif; font-size: 24px; line-height: 1; }
    .offer {
      margin: 29px 0 0;
      color: #76505a;
      font-size: clamp(14px, 2.5vw, 17px);
      line-height: 1.8;
    }
    .offer strong { color: var(--wine); font-weight: 700; }
    .bottom-line {
      width: 54px; height: 3px; margin: 28px auto 0;
      border-radius: 99px; background: var(--gold);
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      main { border-radius: 22px; }
      .orb.one { right: -150px; }
      .orb.three { left: -160px; }
    }
    @media (prefers-reduced-motion: reduce) { .contact { transition: none; } }
  </style>
</head>
<body>
  <div class="orb one"></div><div class="orb two"></div>
  <div class="orb three"></div><div class="orb four"></div>
  <main>
    <p class="eyebrow">ယုံကြည်စွာ ဆော့ကစားနိုင်ပါသည်</p>
    <!-- Replace the URL below with your official Telegram, Viber, or Messenger contact link. -->
    <a class="contact" href="https://smlay.com/" target="_blank" rel="noopener noreferrer">
      ဆက်သွယ်ရန် <span class="arrow" aria-hidden="true">→</span>
    </a>
    <p class="offer"><strong>3000 အသွင်း</strong> · <strong>9000 ဆွတ်ယူလိုက်ပါ</strong></p>
    <div class="bottom-line"></div>
  </main>
</body>
</html>
